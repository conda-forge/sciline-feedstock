context:
  name: sciline
  version: "26.11.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/sciline-${{ version }}.tar.gz
  sha256: 4dce7ef36f49a26cc39b270bda5b43f1f3f6afbaec38e7afd0a9464b906c7dba

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=68
    - setuptools-scm >=8.0
    - pip
  run:
    - python >=${{ python_min }}
    - cyclebane >=24.06.0

tests:
  - python:
      imports:
        - sciline
      python_version:
        - ${{ python_min }}.*
        - "*"
about:
  summary: Build scientific pipelines for your data
  license: BSD-3-Clause
  license_file: LICENSE
  repository: https://github.com/scipp/sciline
  homepage: https://scipp.github.io/sciline/

extra:
  recipe-maintainers:
    - conda-forge/scipp
